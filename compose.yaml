# Local — published ports, no reverse proxy required.
# Usage:  docker compose up -d --build
# Admin:  http://localhost:9080
# API:    http://localhost:9081/v1/chat/completions  (+ X-Api-Key)
#
# Optional Traefik example:  docker compose -f compose.traefik.yaml up -d --build

x-restart: &restart
  restart: unless-stopped

services:
  auth-gateway:
    <<: *restart
    build: .
    container_name: llm-auth-gateway
    env_file: .env
    environment:
      DATA_DIR: /data
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-admin}
      TEMP_GUARD_DISABLED: ${TEMP_GUARD_DISABLED:-false}
      GATEWAY_PORT: ${GATEWAY_PORT:-9081}
      WEB_PORT: ${WEB_PORT:-9080}
      PORT: "8080"
    ports:
      - "${WEB_PORT:-9080}:8080"
    volumes:
      - auth-gateway-data:/data

  llm-gateway:
    <<: *restart
    image: nginx:alpine
    container_name: llm-gateway
    depends_on:
      auth-gateway:
        condition: service_healthy
    env_file: .env
    ports:
      - "${GATEWAY_PORT:-9081}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./scripts/nginx-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]


volumes:
  auth-gateway-data:
